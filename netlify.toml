# Netlify configuration для trip-schedule-app
# Документация: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = ".next"

# Next.js runtime — Netlify автоматически использует @netlify/plugin-nextjs
# при обнаружении Next.js в зависимостях package.json

# Заголовки безопасности (перенесены из vercel.json)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Редиректы для SPA (на случай если Next.js runtime не справится)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Кэширование статики
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
